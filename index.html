<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WIF Trading Rechner</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: white; }
    }
    .container { max-width: 400px; margin: auto; }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</head>
<body>
  <div class="container">
    <h1>WIF Trading Rechner</h1>
    <input id="entry" type="number" placeholder="Einstiegspreis" step="0.0001">
    <input id="leverage" type="number" placeholder="Hebel" value="4">
    <input id="risk" type="number" placeholder="Risiko (%)" value="2.5" step="0.1">
    <input id="target" type="number" placeholder="Zielgewinn (%)" value="5" step="0.1">
    <div id="output"></div>
  </div>
  <script>
    function saveInputs() {
      localStorage.setItem('entry', document.getElementById('entry').value);
      localStorage.setItem('leverage', document.getElementById('leverage').value);
      localStorage.setItem('risk', document.getElementById('risk').value);
      localStorage.setItem('target', document.getElementById('target').value);
    }
    function loadInputs() {
      if (localStorage.getItem('entry')) document.getElementById('entry').value = localStorage.getItem('entry');
      if (localStorage.getItem('leverage')) document.getElementById('leverage').value = localStorage.getItem('leverage');
      if (localStorage.getItem('risk')) document.getElementById('risk').value = localStorage.getItem('risk');
      if (localStorage.getItem('target')) document.getElementById('target').value = localStorage.getItem('target');
      calculate();
    }
    function calculate() {
      const entry = parseFloat(document.getElementById('entry').value);
      const leverage = parseFloat(document.getElementById('leverage').value);
      const risk = parseFloat(document.getElementById('risk').value);
      const target = parseFloat(document.getElementById('target').value);
      if (!entry || !leverage || !risk || !target) {
        document.getElementById('output').innerHTML = '';
        return;
      }
      const sl = entry * (1 - (risk / 100 / leverage));
      const tp = entry * (1 + (target / 100 / leverage));
      document.getElementById('output').innerHTML = `<p>Stop-Loss: ${sl.toFixed(4)} $</p><p>Take-Profit: ${tp.toFixed(4)} $</p>`;
    }
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', () => {
        calculate();
        saveInputs();
      });
    });
    window.onload = loadInputs;
  </script>
</body>
</html>
