<!DOCTYPE html><html lang='de'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>WIF Trading Rechner</title><link rel='manifest' href='manifest.json'><style>body{font-family:Arial,sans-serif;margin:20px;background-color:#f4f4f4}@media(prefers-color-scheme:dark){body{background-color:#121212;color:white}}</style><script>if('serviceWorker'in navigator){navigator.serviceWorker.register('service-worker.js')}</script></head><body><h1>WIF Trading Rechner</h1><input id='entry' placeholder='Einstiegspreis'><input id='leverage' value='4'><input id='risk' value='2.5'><input id='target' value='5'><div id='output'></div><script>function calc(){const e=parseFloat(entry.value),l=parseFloat(leverage.value),r=parseFloat(risk.value),t=parseFloat(target.value);if(!e||!l||!r||!t)return;const s=e*(1-(r/100/l)),p=e*(1+(t/100/l));output.innerHTML=`<p>Stop-Loss: ${s.toFixed(4)} $</p><p>Take-Profit: ${p.toFixed(4)} $</p>`}document.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));window.onload=calc</script></body></html>
